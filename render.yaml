services:
  - type: web
    name: airsave
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build:frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_OUTBOX_WORKER
        value: "false"
